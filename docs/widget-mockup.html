<title>주식 위젯 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 휴대폰 프레임 하나 + 위쪽 탭 + 아래 조절 패널. 나무 스타일, 단일 다크 룩. */
:root{
  color-scheme: dark;
  --page:#0d1014; --panel:#161b22; --line:#262d36;
  --fg:#eef1f4; --sub:#8b95a1; --faint:#5b636d;
  --up:#ff5a5a; --down:#4d8dff;
  --namu-bg:#000; --namu-line:#1f1f1f; --namu-green:#9bd36a; --namu-flat:#4fae86;
  --accent:#9bd36a;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0;text-wrap:balance}
.lead{color:var(--sub);margin:0;line-height:1.55;font-size:13.5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button,.seg button{font:inherit;font-size:13px;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--fg);color:var(--page);border-color:var(--fg);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;font-size:10px;color:#000;background:#f5c542;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle;font-weight:700}

/* 휴대폰 */
.phone{position:relative;height:740px;max-height:84vh;min-height:560px;border-radius:34px;border:6px solid #2a2f36;overflow:hidden;
  background:linear-gradient(160deg,#6b7480 0%,#454a52 45%,#2a2e34 100%);display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;font-size:11px;color:#eee;padding:8px 18px 0}
.home{flex:1;display:flex;flex-direction:column;padding:10px 10px 0;min-height:0}
.pager{flex:1;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;min-height:0;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.dots{display:flex;justify-content:center;gap:8px;padding:10px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:#ffffff66}
.dots i.on{background:#fff}
.dock{display:flex;justify-content:space-around;padding:4px 14px 16px}
.dock span{width:44px;height:44px;border-radius:14px;background:#ffffff26}

/* 위젯: 안쪽 크기는 전부 em 이라 --fs 하나로 글씨 크기 조절 */
.widget{flex:0 0 100%;scroll-snap-align:start;height:var(--wh);border-radius:26px;display:flex;flex-direction:column;
  min-height:0;cursor:pointer;font-size:calc(14px * var(--fs));transition:height .2s;background:var(--namu-bg);padding:1em 1em .7em}
.w-head{display:flex;align-items:center;gap:.6em;flex:none}
.logo{font-weight:700;font-size:1.25em;letter-spacing:-.02em}
.time{margin-left:auto;color:#a8adb3;font-size:1.05em}
.w-ico{margin-left:.4em;font-size:1.25em;color:#9aa0a8}
.sec{min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--namu-flat)}
.grp{color:var(--namu-green);font-weight:700;font-size:1.1em;margin:.8em 0 .3em;flex:none;display:flex;justify-content:space-between;align-items:baseline}
.grp small{color:var(--faint);font-weight:400;font-size:.7em}
.summary{margin:0 0 .4em;padding-left:1.1em;font-size:.86em;line-height:1.5;color:#d5dae0;flex:none}
.row{display:grid;grid-template-columns:1fr auto 3.8em 4.6em;column-gap:.6em;align-items:center;padding:.5em 0;border-bottom:1px solid var(--namu-line)}
.nm{min-width:0}
.nm b{display:block;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:.78em;color:#9aa0a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small i{font-style:normal;color:#7d848c}
.nm small .cy{color:#6f9bd1}
.why{grid-column:1/-1;font-size:.82em;color:#c3c9cf;line-height:1.4;margin-top:.2em}
.row.stale .nm b,.row.stale .v,.row.stale .d,.row.stale .p{color:#62686f}
.row.stale .nm small,.row.stale .nm small .cy{color:#4e545a}
.ix.stale .l1 b,.ix.stale .l1 span{color:#62686f}
.old{font-style:normal;font-size:.85em;color:#8b8f95;border:1px solid #3a3a3a;border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap}
.v{font-size:1.02em;text-align:right}
.v .ar{font-size:.8em;margin-left:.25em}
.d,.p{text-align:right;font-size:1.02em}
.mute{color:#9aa0a8}
.foot{font-size:.7em;color:var(--faint);text-align:right;padding-top:.4em;flex:none}
.score{display:grid;grid-template-columns:auto auto 1fr auto;align-items:baseline;column-gap:.5em;margin-top:.7em;padding:.55em .75em .6em;background:#121212;border-radius:.7em;flex:none}
.score .sl{font-size:.85em;color:#9aa0a8}
.score .sv{font-size:1.6em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .sz{font-size:1em;font-weight:500;white-space:nowrap}
.score .sd{font-size:.82em;white-space:nowrap}
.sbar{grid-column:1/-1;position:relative;height:.35em;border-radius:.2em;margin-top:.5em;background:linear-gradient(90deg,#a46cf0 0 20%,#e0883c 20% 40%,#c2b25a 40% 60%,#9bd36a 60% 80%,#39c27a 80%)}
.sbar i{position:absolute;top:-.25em;width:.25em;height:.85em;background:#fff;border-radius:.1em;transform:translateX(-50%)}
.zones{display:grid;grid-template-columns:repeat(5,1fr);font-size:.72em;color:var(--sub);text-align:center;margin-top:.35em}
.sc-top{display:flex;align-items:center;gap:.7em}
.sc-top>b{font-size:2.6em;line-height:1;font-variant-numeric:tabular-nums}
.sc-top .sz{font-size:1.15em;font-weight:700}
.sc-top small{display:block;color:var(--sub);font-size:.8em;margin-top:.15em}
.aiwhy{background:#1b1b1b;border-radius:8px;padding:.55em .7em;margin:.8em 0 .3em!important;font-size:.88em!important}
.smeta{white-space:nowrap}
.smeta .chip{margin-left:0;font-size:1em;font-weight:700}
.chip{font-size:.75em;font-weight:500;margin-left:.35em;white-space:nowrap}
.set-row{flex-wrap:wrap}
.hin{margin-left:auto;font-size:.8em;color:var(--sub);white-space:nowrap}
.hin i{font-style:normal;display:inline-block;min-width:4.6em;border:1px solid #333;border-radius:6px;padding:1px 6px;color:var(--fg);margin:0 .3em;text-align:right}
.set-row .hin+.x{margin-left:.4em}
.hold{font-size:.84em;color:#c3c9cf;margin-top:.35em}
details.sd2{margin-top:.45em}
details.sd2 summary{cursor:pointer;font-size:.86em;color:var(--sub);list-style:none}
details.sd2 summary::-webkit-details-marker{display:none}
.fx{display:grid;grid-template-columns:1fr auto;gap:.25em .6em;padding:.55em 0;border-bottom:1px solid #222}
.fx:last-of-type{border:0}
.fx b{font-size:.9em;font-weight:500}
.fx b small{color:var(--faint);font-weight:400;margin-left:.3em;font-size:.85em}
.fx .raw{font-size:.8em;color:var(--sub);text-align:right}
.fx .bar2{grid-column:1/-1;display:flex;align-items:center;gap:.5em}
.fx .bar2 span{flex:1;height:.42em;background:#262626;border-radius:.21em;overflow:hidden}
.fx .bar2 span i{display:block;height:100%;border-radius:.21em}
.fx .bar2 em{font-style:normal;font-size:.8em;color:#c3c9cf;min-width:6.2em;text-align:right;font-variant-numeric:tabular-nums}

/* 앱 화면 */
.app{flex:1;background:#0a0a0a;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;font-size:calc(14px * var(--fs))}
.app-top{display:flex;align-items:center;gap:10px}
.app-top b{font-size:1.2em;margin-right:auto}
.app-top span{font-size:.8em;color:var(--sub)}
.card{background:#141414;border-radius:16px;padding:.85em 1em}
.card h3{font-size:.95em;margin:0 0 .5em;color:var(--accent)}
.card p{margin:0;font-size:.93em;line-height:1.6;color:#d5dae0}
.card .hint{font-size:.82em;color:var(--sub);margin-top:.4em}
.st{padding:.6em 0;border-bottom:1px solid #222}
.st:last-child{border:0}
.st .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.st .l1 small{color:var(--faint);font-size:.8em;margin-left:4px;font-weight:400}
.st p{font-size:.86em;color:var(--sub);margin-top:.3em;line-height:1.5}
.ix{padding:.7em 0;border-bottom:1px solid #222;display:flex;flex-direction:column;gap:.25em}
.ix:last-child{border:0}
.ix .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ix .desc{color:#c3c9cf;font-size:.86em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:.15em .6em;font-size:.8em;color:var(--sub);background:#1b1b1b;border-radius:8px;padding:.45em .6em;margin-top:.15em}
.meta dt{color:#7d848c}
.meta dd{margin:0;color:#c3c9cf}
.set-row{display:flex;align-items:center;gap:10px;padding:.65em 0;border-bottom:1px solid #222}
.set-row .h{color:var(--faint)}
.set-row .x{margin-left:auto;color:var(--sub);font-size:.85em;border:1px solid #333;border-radius:8px;padding:2px 8px}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;background:#000;border:1px solid #333;border-radius:10px;color:var(--fg);padding:9px 10px;font:inherit;font-size:.93em}
.add button{background:var(--accent);color:#000;border:0;border-radius:10px;padding:0 14px;font:inherit;font-weight:700}
.opt{display:flex;justify-content:space-between;gap:10px;padding:.6em 0;font-size:.93em;border-bottom:1px solid #222}
.opt:last-child{border:0}
.opt span{color:var(--sub);text-align:right}

/* 조절 패널 */
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.ctrl label,.ctrl .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.ctrl label b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dis{opacity:.4}
.note{font-size:12.5px;color:var(--sub);line-height:1.65;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.note b{color:var(--fg)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:12px}
.tbl th,.tbl td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--fg);font-weight:500}
@media (prefers-reduced-motion:reduce){.widget{transition:none}}
</style>

<div class="wrap">
  <h1>마켓 날씨 시안 <span class="tag">숫자는 예시</span></h1>
  <p class="lead">나무 스타일로 정리했어요. 지표마다 <b>언제 기준 숫자인지</b>와 <b>얼마나 자주 바뀌는지</b>를 적었어요. 위젯을 누르면 앱 화면이 열려요.</p>

  <div class="tabs" role="tablist">
    <button id="t-w" role="tab" aria-selected="true" data-v="w">위젯</button>
    <button id="t-d" role="tab" aria-selected="false" data-v="d">앱 상세</button>
    <button id="t-s" role="tab" aria-selected="false" data-v="s">설정</button>
  </div>

  <div class="phone">
    <div class="status"><span>8:31</span><span>LTE 87%</span></div>
    <div id="screen" class="home"></div>
  </div>

  <div class="ctrl" id="ctrl">
    <div class="lab">페이지 구성</div>
    <div class="seg">
      <button id="pg1" type="button" aria-pressed="true" data-p="1">한 장에 모두</button>
      <button id="pg2" type="button" aria-pressed="false" data-p="2">두 장 (넘기기)</button>
    </div>
    <label for="fs">글씨 크기 <b id="fsv">100%</b></label>
    <input type="range" id="fs" min="80" max="140" step="5" value="100">
    <label for="wh">위젯 세로 크기 <b id="whv">100%</b></label>
    <input type="range" id="wh" min="50" max="100" step="5" value="100">
    <div id="spbox">
      <label for="sp">종목 칸 : 지표 칸 <b id="spv">55 : 45</b></label>
      <input type="range" id="sp" min="30" max="80" step="5" value="55">
    </div>
    <label for="sm">시황 요약 보이기 <b id="smv">켬</b></label>
    <input type="range" id="sm" min="0" max="1" step="1" value="1">
  </div>

  <div class="note">
    <b>지표마다 나오는 시기가 달라요</b> (한국 시각 기준)
    <div class="tbl"><table>
      <thead><tr><th>지표</th><th>바뀌는 때</th><th>앱 반영</th></tr></thead>
      <tbody id="cyc"></tbody>
    </table></div>
    앱은 30분마다 서버에서 새 숫자를 받아요. 하지만 원래 하루나 한 달에 한 번 나오는 지표는 그때까지 같은 숫자가 보여요. 하루 넘게 지난 숫자는 회색으로 흐리게 보여요.
  </div>
</div>

<script>
// 종목: [이름, 코드, 가격, 변동, 등락률, 이유, 기준]
const S=[
 ["삼성전자","005930","232,000","4,800",+2.11,"HBM4 엔비디아 납품 기대에 외국인 순매수","10/28 15:30 종가"],
 ["SK하이닉스","000660","1,526,000","22,000",+1.46,"메모리 가격 상승 전망 리포트","10/28 15:30 종가"],
 ["NAVER","035420","174,900","1,500",-0.85,"광고 매출 둔화 우려","10/28 15:30 종가"],

const I=[

 ["추세 (S&P500·코스피 200일 평균)",20,"둘 다 평균 위",80],

 ["하이일드 스프레드",15,"3.12%p",72],
 ["미국 10년물 금리",10,"4.21%, 1달 +0.15%p",55],
 ["공포탐욕지수",10,"62 탐욕",95],
 ["달러지수 1달 변화",10,"+0.8%",45],
 ["원/달러 1달 변화",10,"+1.2% (원화 약세)",40],
 ["장단기 금리차",5,"+0.45%p",70],
 ["Margin Debt 전년비",5,"+18.4%",55]
];
const ZONES=[[80,"☀️","맑음","#39c27a"],[60,"🌤","구름 조금","#9bd36a"],[40,"☁️","흐림","#c2b25a"],[20,"🌧","비","#e0883c"],[0,"⛈","폭풍","#a46cf0"]];
const zone=s=>ZONES.find(z=>s>=z[0]);
const TOTAL=Math.round(F.reduce((a,f)=>a+f[1]*f[3]/100,0)), PREV=64;
function scoreBand(){const z=zone(TOTAL),d=TOTAL-PREV;
  return `<div class="score"><span class="sl">시장 점수</span><b class="sv" style="color:${z[3]}">${TOTAL}</b><span class="sz">${z[1]} ${z[2]}</span><span class="sd ${cls(d)}">어제보다 ${arr(d)}${Math.abs(d)}</span><div class="sbar"><i style="left:${TOTAL}%"></i></div></div>`}
function scoreCard(){const z=zone(TOTAL),d=TOTAL-PREV;
  return `<div class="card"><h3>시장 점수</h3>
   <div class="sc-top"><b style="color:${z[3]}">${TOTAL}</b><div><div class="sz">${z[1]} ${z[2]}</div><small>어제 ${PREV} → 오늘 ${TOTAL} (<span class="${cls(d)}">${arr(d)}${Math.abs(d)}</span>)</small></div></div>
   <div class="sbar"><i style="left:${TOTAL}%"></i></div>
   <div class="zones"><span>⛈ 폭풍</span><span>🌧 비</span><span>☁️ 흐림</span><span>🌤 구름조금</span><span>☀️ 맑음</span></div>
   <p class="aiwhy">🤖 VIX와 신용 위험은 안정적이고 상승 추세도 이어지고 있어요. 다만 달러와 환율이 오르고 금리가 높아 감점됐어요.</p>
   ${F.map(f=>{const c=zone(f[3])[3];return `<div class="fx"><b>${f[0]}<small>가중치 ${f[1]}</small></b><span class="raw">${f[2]}</span>
     <div class="bar2"><span><i style="width:${f[3]}%;background:${c}"></i></span><em>${f[3]}점 → +${(f[1]*f[3]/100).toFixed(1)}</em></div></div>`}).join("")}
   <div class="hint">10/29 08:30 계산 · 30분마다 다시 계산. 추세·하이일드·금리차는 하루 1번, Margin Debt는 한 달 1번 바뀌어요. 빈 항목은 빼고 나머지로 100점 만점 환산. 참고용이에요.</div></div>`}
// 종목 점수: 항목별 점수 + (선택) 평단·수량
const FN=["추세","상대 강도","뉴스 분위기","위험도","가격 수준"],FW=[30,20,20,15,15];
const SC={
 "삼성전자":{f:[80,70,85,60,55],avg:198000,qty:10,ai:"세 평균선 위에서 상승 추세이고 HBM 납품 뉴스가 호재예요. 다만 1년 최고가 근처라 가격 부담이 조금 있어요."},
 "SK하이닉스":{f:[90,85,70,45,40],avg:1210000,qty:2,ai:"시장보다 훨씬 강하게 올랐어요. 단기간 급등해서 출렁임과 가격 부담이 커요."},
 "NAVER":{f:[35,30,40,55,70],ai:"200일 평균 아래로 내려와 추세가 약해요. 대신 과거보다 싸게 거래 중이에요."},
 "현대차":{f:[55,45,50,60,75],avg:305000,qty:5,ai:"추세는 보통이고, 로봇 사업 기대가 줄어든 뉴스가 부담이에요. 가격은 싼 편이에요."},
 "엔비디아":{f:[75,60,55,50,35],avg:150.2,qty:15,ai:"상승 추세는 유지 중이지만 최근 반도체주 약세로 힘이 빠졌어요."},
 "TSMC":{f:[70,65,40,55,45],ai:"추세는 괜찮지만 대만 규제 뉴스가 악재로 작용했어요."},
 "테슬라":{f:[45,35,40,35,25],avg:420,qty:3,ai:"평균선 아래로 내려왔고 인도량 부진 뉴스가 겹쳤어요. 가격도 비싼 편이에요."},
 "애플":{f:[65,50,75,70,40],ai:"신제품 판매 호조 뉴스가 좋고, 출렁임이 작은 편이에요."}
};
function sscore(n){const x=SC[n];return x?Math.round(x.f.reduce((a,v,i)=>a+v*FW[i]/100,0)):null}
function chip(n){const v=sscore(n);if(v==null)return "";const z=zone(v);return `<span class="chip" style="color:${z[3]}">${v}${z[1]}</span>`}
function holdCalc(s){const x=SC[s[0]];if(!x||!x.qty)return null;const p=parseFloat(s[2].replace(/,/g,""));
  return {r:(p/x.avg-1)*100,amt:(p-x.avg)*x.qty,us:/^[A-Z]/.test(s[1]),x}}
const signPct=r=>(r>0?"+":"")+r.toFixed(1)+"%";
function metaTxt(s){const v=chip(s[0]),h=holdCalc(s);if(!v&&!h)return "";
  return `<span class="smeta">${v}${h?` · 내 수익 <span class="${cls(h.r)}">${signPct(h.r)}</span>`:""}</span> · `}
function holdTxt(s){const h=holdCalc(s);return h?` · 내 수익 <span class="${cls(h.r)}">${signPct(h.r)}</span>`:""}
function money(v,us){return us?"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(Math.abs(v)).toLocaleString("ko-KR")+"원"}
function stockDetail(s){const x=SC[s[0]];if(!x)return "";const v=sscore(s[0]),z=zone(v),h=holdCalc(s);
  const hold=h?`<div class="hold">보유 ${x.qty}주 · 평단 ${h.us?"$"+x.avg.toFixed(2):x.avg.toLocaleString("ko-KR")+"원"} · 내 수익 <span class="${cls(h.r)}">${signPct(h.r)} (${h.amt>=0?"+":"-"}${money(h.amt,h.us)})</span></div>`:"";
  return `${hold}<details class="sd2"${s[0]==="삼성전자"?" open":""}><summary>종목 점수 <b style="color:${z[3]}">${v}</b> ${z[1]} ${z[2]} · 항목별 보기 ▾</summary>
   <p class="aiwhy">🤖 ${x.ai}</p>${x.f.map((f,i)=>`<div class="fx"><b>${FN[i]}<small>가중치 ${FW[i]}</small></b><span class="raw">${f}점</span><div class="bar2"><span><i style="width:${f}%;background:${zone(f)[3]}"></i></span><em>+${(FW[i]*f/100).toFixed(1)}</em></div></div>`).join("")}</details>`}
const head=`<div class="w-head"><span class="logo">마켓 날씨</span><span class="time num">08:30:00 ↻</span><span class="w-ico">⚙</span></div>${scoreBand()}`;

function stockRow(s){const c=cls(s[4]);return `<div class="row"><div class="nm"><b>${s[0]}</b><small>${s[1]}</small></div>
 <span class="v num ${c}">${s[2]}${/^[A-Z]/.test(s[1])&&s[4]?`<span class="ar">${arr(s[4])}</span>`:""}</span><span class="d num ${c}">${s[3]}</span><span class="p num ${c}">${pct(s[4])}</span><span class="why">${metaTxt(s)}${s[5]}</span></div>`}
function indRow(i){const h=indRow0(i);return i.stale?h.replace('class="row"','class="row stale"'):h}
function indRow0(i){
  const sub=`<small>${i.b} 기준 · <span class="cy">${i.c}</span></small>`;
  if(i.p===null) return `<div class="row"><div class="nm"><b>${i.n}</b>${sub}</div><span class="v num">${i.v}</span><span class="d num mute" style="grid-column:span 2">${i.d}</span></div>`;
  if(i.fg) return `<div class="row"><div class="nm"><b>${i.n}</b>${sub}</div><span class="v num up">${i.v}</span><span class="d num up">${i.d}</span><span class="p num up">+${i.p}</span></div>`;
  const c=cls(i.p);return `<div class="row"><div class="nm"><b>${i.n}</b>${sub}</div><span class="v num ${c}">${i.v}</span><span class="d num ${c}">${i.d}</span><span class="p num ${c}">${pct(i.p)}</span></div>`}

function widgets(){
  const sp=+$("sp").value, sm=$("sm").value==="1";
  const ai=sm?`<div class="grp">오늘 시황<small>AI · 08:00 작성 · 하루 5번</small></div>${SUM}`:"";
  const stocks=S.map(stockRow).join(""), inds=I.map(indRow).join("");
  const sl=`<div class="grp">관심 종목<small>이슈: 최근 24시간 뉴스 · 30분마다</small></div>`;
  const il=`<div class="grp">시장 지표<small>회색 = 하루 넘게 지난 숫자</small></div>`;
  if(st.pages===1) return `<div class="widget">${head}${ai}
    <div class="sec" style="flex:${sp}">${sl}<div class="scroll">${stocks}</div></div>
    <div class="sec" style="flex:${100-sp}">${il}<div class="scroll">${inds}</div></div>
    <div class="foot">누르면 자세히 보기</div></div>`;
  return `<div class="widget">${head}${ai}<div class="sec" style="flex:1">${sl}<div class="scroll">${stocks}</div></div><div class="foot">옆으로 넘기면 지표 →</div></div>
          <div class="widget">${head}<div class="sec" style="flex:1">${il}<div class="scroll">${inds}</div></div><div class="foot">← 종목으로</div></div>`;
}

function render(){
  const sc=$("screen"), v=st.view;
  sc.style.setProperty("--fs",+$("fs").value/100);
  sc.style.setProperty("--wh",$("wh").value+"%");
  const off=v!=="w";
  ["pg1","pg2","wh","sp","sm"].forEach(id=>$(id).disabled=off);
  if(v==="w"){
    sc.className="home";
    sc.innerHTML=`<div class="pager">${widgets()}</div><div class="dots">${[0,1,2,3,4].map(k=>`<i class="${k===3?"on":""}"></i>`).join("")}</div><div class="dock"><span></span><span></span><span></span><span></span><span></span></div>`;
    sc.querySelectorAll(".widget").forEach(w=>w.onclick=()=>setView("d"));
  }else if(v==="d"){
    sc.className="app";
    sc.innerHTML=`<div class="app-top"><b>‹ 마켓 날씨</b><span>마지막 업데이트 10/29 08:30</span></div>
    ${scoreCard()}
    <div class="card"><h3>오늘 시황 (AI 요약)</h3><p>코스피는 삼성전자와 SK하이닉스가 이끌며 1.2% 올랐어요. 반면 미국 기술주는 최근 많이 오른 데 따른 차익 실현으로 약세였어요. 원/달러 환율은 1,385원으로 소폭 올랐고, 시장 불안 지표인 VIX는 16대로 안정적이에요.</p>
      <div class="hint">10/29 08:00 작성 · 국내 10/28 장 + 밤사이 미국 10/28 장 기준<br>하루 5번 새로 요약: 06:00 미국 장 끝 · 08:00 국내 장 전 · 12:00 점심 · 15:40 국내 장 끝 · 21:00 미국 장 전</div></div>
    <div class="card"><h3>관심 종목 · 종목 점수</h3>${S.map(s=>`<div class="st"><div class="l1"><b>${s[0]}<small>${s[1]}</small>${chip(s[0])}</b><span class="num ${cls(s[4])}">${s[2]} ${pct(s[4])}</span></div><p>${s[5]}. 관련 뉴스 2~3건 요약이 여기에 들어가요.<br>가격: ${s[6]} 기준 · 장중 30분마다 갱신<br>이슈: 10/29 08:30까지 최근 24시간 뉴스 · 30분마다 새 뉴스 확인</p>${stockDetail(s)}</div>`).join("")}</div>
    <div class="card"><h3>시장 지표</h3>${I.map(i=>{
      const c=i.p===null?"":i.fg?"up":cls(i.p);
      const val=i.p===null?`${i.v} (${i.d})`:i.fg?`${i.v} ${i.d}`:`${i.v} ${arr(i.p)}${i.d}`;
      return `<div class="ix${i.stale?" stale":""}"><div class="l1"><b>${i.n}</b><span class="num ${c}">${val}</span></div>
        <span class="desc">${i.desc}${i.stale?'<em class="old">하루 넘게 지난 숫자</em>':''}</span>
        <dl class="meta"><dt>기준</dt><dd>${i.B}</dd><dt>바뀌는 때</dt><dd>${i.C}</dd><dt>앱 반영</dt><dd>${i.A}</dd></dl></div>`}).join("")}</div>`;
  }else{
    sc.className="app";
    sc.innerHTML=`<div class="app-top"><b>‹ 설정</b></div>
    <div class="card"><h3>관심·보유 종목 (끌어서 순서 바꾸기)</h3>
      <p class="hint">평단과 수량은 선택이에요. 이 휴대폰에만 저장되고 서버로 보내지 않아요.</p>
      ${S.map(s=>{const x=SC[s[0]]||{},us=/^[A-Z]/.test(s[1]);return `<div class="set-row"><span class="h">☰</span>${s[0]}<span class="hin">평단<i>${x.avg?(us?"$"+x.avg.toFixed(2):x.avg.toLocaleString("ko-KR")):"-"}</i>수량<i>${x.qty||"-"}</i></span><span class="x">삭제</span></div>`}).join("")}
      <div class="add"><input id="addq" placeholder="종목 이름이나 코드 입력" aria-label="종목 추가"><button type="button">추가</button></div></div>
    <div class="card"><h3>위젯 모양</h3>
      <div class="opt">페이지 구성<span>한 장 / 두 장</span></div>
      <div class="opt">글씨 크기<span>80% ~ 140%</span></div>
      <div class="opt">종목 칸 : 지표 칸<span>55 : 45</span></div>
      <div class="opt">시황 요약 보이기<span>켬</span></div>
      <div class="opt">시장 점수 보이기<span>켬</span></div>
      <div class="opt">종목 점수·내 수익률 보이기<span>켬</span></div>
      <div class="opt">상승 색<span>빨강 (한국식)</span></div>
      <div class="opt">새 데이터 받기<span>30분마다</span></div>
      <div class="opt">시황 요약 시각<span>06:00 · 08:00 · 12:00 · 15:40 · 21:00</span></div></div>`;
  }
  $("fsv").textContent=$("fs").value+"%";
  $("whv").textContent=$("wh").value+"%";
  $("spv").textContent=$("sp").value+" : "+(100-$("sp").value);
  $("smv").textContent=$("sm").value==="1"?"켬":"끔";
  $("spbox").classList.toggle("dis",st.pages===2||off);
  if(st.pages===2) $("sp").disabled=true;
}
$("cyc").innerHTML=I.map(i=>`<tr><td>${i.n}</td><td>${{"30분":"평일 계속","美장중":"미국 장중만","월 1회":"한 달에 1번","매일 23시":"매일 밤 11시쯤"}[i.c]}</td><td>${i.A}</td></tr>`).join("")
 +`<tr><td>국내 주식</td><td>09:00~15:30</td><td>장중 30분마다</td></tr><tr><td>미국 주식</td><td>밤 10:30~새벽 5:00</td><td>장중 30분마다</td></tr><tr><td>AI 시황 요약</td><td>직전 국내·미국 장</td><td>06·08·12·15:40·21시</td></tr><tr><td>종목 이슈</td><td>최근 24시간 뉴스</td><td>30분마다</td></tr><tr><td>시장 점수</td><td>위 지표로 계산</td><td>30분마다</td></tr><tr><td>종목 점수</td><td>주가·뉴스로 계산</td><td>30분마다</td></tr><tr><td>내 수익률</td><td>현재가 ÷ 평단</td><td>휴대폰에서 계산</td></tr>`;
function setView(v){st.view=v;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{st.pages=+b.dataset.p;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
["fs","wh","sp","sm"].forEach(id=>$(id).oninput=render);
render();
</script>
